[package]
name = "enso-time"
version = "0.2.0-beta.1"
description = "Private, local-first time diagnosis by Ensō"
authors = ["Ensō"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "enso_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
aw-server = { path = "../vendor/activitywatch/aw-server" }
aw-datastore = { path = "../vendor/activitywatch/aw-datastore" }
aw-models = { path = "../vendor/activitywatch/aw-models" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
gethostname = "0.4"
log = "0.4"
rusqlite = { version = "0.30", features = ["bundled"] }
rocket = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
