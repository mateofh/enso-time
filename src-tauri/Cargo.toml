[package]
name = "enso-time"
version = "0.2.0"
description = "Private, local-first time diagnosis by Ensō"
authors = ["Ensō"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "enso_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# OpenRouter evaluation and screen OCR are deferred to v0.3; see src/features.rs.
experimental-intelligence = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
aw-server = { path = "../vendor/activitywatch/aw-server" }
aw-datastore = { path = "../vendor/activitywatch/aw-datastore" }
aw-models = { path = "../vendor/activitywatch/aw-models" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
gethostname = "0.4"
log = "0.4"
keyring = "4.1.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.30", features = ["bundled"] }
rocket = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGImage", "CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
