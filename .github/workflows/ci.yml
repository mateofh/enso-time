name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            aw_target: macos-arm64
          - label: Windows x64
            os: windows-2025
            aw_target: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ci-${{ runner.os }}-${{ runner.arch }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the project-pinned Chromium build
        run: npm run test:e2e:install

      - name: Validate license boundaries and packaged notices
        run: node scripts/license-check.mjs

      - name: Validate application
        run: npm run check

      - name: Test ActivityWatch packaging rules
        run: npm run test:activitywatch

      - name: Validate target selection without downloading
        run: node scripts/prepare-activitywatch.mjs --target ${{ matrix.aw_target }} --dry-run

      - name: Test Rust workspace
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
