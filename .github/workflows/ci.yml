name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            aw_target: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            aw_target: macos-x86_64
          - label: Windows x64
            os: windows-2025
            aw_target: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ci-${{ runner.os }}-${{ runner.arch }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the project-pinned Chromium build
        run: npm run test:e2e:install

      - name: Validate license boundaries and packaged notices
        run: |
          node scripts/license-check.mjs
          node scripts/license-check.mjs --simulate-crlf

      - name: Validate application, Rust, packaging, and release contracts
        run: npm run qa

      - name: Validate target selection without downloading
        run: node scripts/prepare-activitywatch.mjs --target ${{ matrix.aw_target }} --dry-run

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-${{ matrix.aw_target }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            node_modules/.cache/enso-time-qa/
            node_modules/.cache/enso-time-playwright/
            node_modules/.cache/enso-time-playwright-report/
