name: Release desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            aw_target: macos-arm64
            bundles: dmg
          - label: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            aw_target: macos-x86_64
            bundles: dmg
          - label: Windows x64
            os: windows-2025
            rust_target: x86_64-pc-windows-msvc
            aw_target: windows-x86_64
            bundles: msi,nsis
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      AW_TARGET: ${{ matrix.aw_target }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.rust_target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the project-pinned Chromium build
        run: npm run test:e2e:install

      - name: Validate release version and license metadata
        shell: bash
        run: |
          node scripts/license-check.mjs --strict-manifests
          node <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = "v" + packageVersion;
          const values = { packageVersion, tauriVersion, cargoVersion, releaseTag: process.env.RELEASE_TAG };
          if (process.env.RELEASE_TAG !== expectedTag || tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            console.error("Release version mismatch:", values);
            process.exit(1);
          }
          NODE

      - name: Validate application and ActivityWatch preparer
        run: |
          npm run check
          npm run test:activitywatch

      - name: Prepare pinned ActivityWatch watchers
        run: node scripts/prepare-activitywatch.mjs --target ${{ matrix.aw_target }}

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.rust_target }} -- --test-threads=1

      - name: Force ad-hoc macOS signing and no certificate configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = process.platform === "darwin"
            ? { bundle: { macOS: { signingIdentity: "-" } } }
            : {};
          fs.writeFileSync("src-tauri/ci-bundle.json", JSON.stringify(config));
          NODE

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --config src-tauri/ci-bundle.json

      - name: Smoke-test macOS bundle resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          test "$(find "$bundle_dir" -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          dmg_file="$(find "$bundle_dir" -type f -name '*.dmg' -print -quit)"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_file"
          test -n "$(find "$mount_dir" -type d -name '*.app' -print -quit)"
          for required in POLYFORM-NONCOMMERCIAL-1.0.0.txt MPL-2.0.txt THIRD_PARTY_NOTICES.md aw-watcher-window aw-watcher-afk; do
            test -n "$(find "$mount_dir" -type f -name "$required" -print -quit)"
          done

      - name: Smoke-test Windows installer resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter *.msi)
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer before smoke testing."
          }

          $msiExtract = Join-Path $env:RUNNER_TEMP "enso-time-msi-smoke"
          $nsisExtract = Join-Path $env:RUNNER_TEMP "enso-time-nsis-smoke"
          New-Item -ItemType Directory -Force $msiExtract, $nsisExtract | Out-Null
          $msiArgs = @("/a", "`"$($msi[0].FullName)`"", "/qn", "TARGETDIR=`"$msiExtract`"")
          $msiProcess = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($msiProcess.ExitCode)."
          }
          & 7z x -y "-o$nsisExtract" $nsis[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS structural extraction failed with exit code $LASTEXITCODE."
          }

          foreach ($root in @($msiExtract, $nsisExtract)) {
            foreach ($required in @(
              "POLYFORM-NONCOMMERCIAL-1.0.0.txt",
              "MPL-2.0.txt",
              "THIRD_PARTY_NOTICES.md",
              "aw-watcher-window.exe",
              "aw-watcher-afk.exe"
            )) {
              if (-not (Get-ChildItem $root -Recurse -File -Filter $required -ErrorAction SilentlyContinue)) {
                throw "Missing $required in extracted installer at $root."
              }
            }
          }

      - name: Stage macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          test "$(find "$bundle_dir" -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          dmg_file="$(find "$bundle_dir" -type f -name '*.dmg' -print -quit)"
          cp "$dmg_file" "release-assets/enso-time-${RELEASE_TAG#v}-${AW_TARGET}.dmg"

      - name: Stage Windows MSI and NSIS installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $bundle = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter *.msi)
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer; found $($msi.Count) MSI and $($nsis.Count) NSIS."
          }
          $version = $env:RELEASE_TAG.TrimStart("v")
          Copy-Item $msi[0].FullName "release-assets/enso-time-$version-${env:AW_TARGET}.msi"
          Copy-Item $nsis[0].FullName "release-assets/enso-time-$version-${env:AW_TARGET}.exe"

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: enso-time-${{ matrix.aw_target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 | sort -z)
          test "${#files[@]}" -eq 4
          test "$(printf '%s\n' "${files[@]##*/}" | sort -u | wc -l)" -eq 4
          : > SHA256SUMS
          for file in "${files[@]}"; do
            sha256sum "$file" | sed "s#  .*#  $(basename "$file")#" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          test -s SHA256SUMS

      - name: Generate GitHub build provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: SHA256SUMS

      - name: Stage the Sigstore attestation bundle
        shell: bash
        run: |
          test -s "${{ steps.provenance.outputs.bundle-path }}"
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "enso-time-${RELEASE_TAG#v}-provenance.sigstore.json"

      - name: Publish installers and checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Ensō Time ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Public source-available beta. Use is limited by PolyForm Noncommercial 1.0.0.

            These builds do not use paid signing or notarization certificates. The macOS app is ad-hoc signed for DMG packaging and is not notarized. Windows MSI and NSIS installers are unsigned. Verify downloads against SHA256SUMS.

            GitHub build provenance is available through the attestations API and the attached Sigstore bundle. Verify an installer with `gh attestation verify INSTALLER --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/release.yml`. Provenance does not replace Apple Developer ID/notarization or Windows Authenticode and does not suppress Gatekeeper or SmartScreen warnings.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            SHA256SUMS
            enso-time-*-provenance.sigstore.json
