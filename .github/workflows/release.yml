name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: One-time immutable tag allowed for the manual beta.2 backfill
        required: true
        type: choice
        options:
          - v0.1.0-beta.2

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      workflow_commit: ${{ steps.resolve.outputs.workflow_commit }}
      workflow_ref: ${{ steps.resolve.outputs.workflow_ref }}

    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Resolve and authorize the release source
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BACKFILL_TAG: v0.1.0-beta.2
          BACKFILL_SOURCE_COMMIT: fceb6c7929e0cf469de9af482c0fb21da34062d9
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              [[ "$TRIGGER_REF" == refs/tags/* ]] || {
                echo "A release push must be triggered by a tag." >&2
                exit 1
              }
              release_tag="${TRIGGER_REF#refs/tags/}"
              ;;
            workflow_dispatch)
              [[ "$TRIGGER_REF" == "refs/heads/main" ]] || {
                echo "Manual backfill must run from refs/heads/main." >&2
                exit 1
              }
              [[ "$REQUESTED_TAG" == "$BACKFILL_TAG" ]] || {
                echo "Manual dispatch is restricted to $BACKFILL_TAG." >&2
                exit 1
              }
              release_tag="$BACKFILL_TAG"
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || {
            echo "Release tag does not match the supported release format: $release_tag" >&2
            exit 1
          }
          [[ "$WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Workflow commit is not a full Git SHA." >&2
            exit 1
          }

          git fetch --force --no-tags origin \
            "refs/tags/${release_tag}:refs/enso-release/source-tag"
          source_commit="$(git rev-parse 'refs/enso-release/source-tag^{commit}')"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Resolved source is not a full Git SHA." >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$source_commit" == "$TRIGGER_SHA" ]] || {
              echo "The pushed tag no longer resolves to the triggering commit." >&2
              exit 1
            }
            [[ "$WORKFLOW_COMMIT" == "$source_commit" ]] || {
              echo "The tag-push signer does not match the immutable source commit." >&2
              exit 1
            }
          else
            [[ "$source_commit" == "$BACKFILL_SOURCE_COMMIT" ]] || {
              echo "The immutable beta.2 tag no longer resolves to its approved commit." >&2
              exit 1
            }
            [[ "$TRIGGER_SHA" == "$WORKFLOW_COMMIT" ]] || {
              echo "The backfill OIDC source does not match the audited workflow commit." >&2
              exit 1
            }
          fi

          {
            echo "release_tag=$release_tag"
            echo "source_commit=$source_commit"
            echo "workflow_commit=$WORKFLOW_COMMIT"
            echo "workflow_ref=$WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the immutable source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.source_commit }}
          fetch-depth: 1

      - name: Verify immutable source checkout
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.resolve.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

  build:
    name: Build ${{ matrix.label }}
    environment: signing
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            aw_target: macos-arm64
            bundles: dmg
          - label: macOS Intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            aw_target: macos-x86_64
            bundles: dmg
          - label: Windows x64
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            aw_target: windows-x86_64
            bundles: msi,nsis
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      ENSO_SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      AW_TARGET: ${{ matrix.aw_target }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
          fetch-depth: 1

      - name: Verify immutable source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.rust_target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the project-pinned Chromium build
        run: npm run test:e2e:install

      - name: Validate release version and license metadata
        shell: bash
        run: |
          node scripts/license-check.mjs --strict-manifests
          node <<'NODE'
          const fs = require("node:fs");
          const packageVersion = require("./package.json").version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expectedTag = "v" + packageVersion;
          const values = { packageVersion, tauriVersion, cargoVersion, releaseTag: process.env.RELEASE_TAG };
          if (process.env.RELEASE_TAG !== expectedTag || tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            console.error("Release version mismatch:", values);
            process.exit(1);
          }
          NODE

      - name: Validate application and ActivityWatch preparer
        run: |
          npm run qa

      - name: Prepare pinned ActivityWatch watchers
        run: node scripts/prepare-activitywatch.mjs --target ${{ matrix.aw_target }}

      - name: Smoke-test Windows Script Host required by WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cscript = Get-Command cscript.exe -CommandType Application -ErrorAction Stop
          $probe = Join-Path $env:RUNNER_TEMP "enso-wix-vbscript-smoke.vbs"
          try {
            [System.IO.File]::WriteAllText($probe, "WScript.Quit 0", [System.Text.Encoding]::ASCII)
            & $cscript.Source //B //NoLogo $probe
            if ($LASTEXITCODE -ne 0) {
              throw "cscript.exe could not execute VBScript; WiX MSI validation is unavailable."
            }
          } finally {
            Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue
          }

      - name: Require stable signing credentials
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          node <<'NODE'
          const names = process.platform === 'darwin'
            ? ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID']
            : ['WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_CERTIFICATE_THUMBPRINT'];
          for (const name of names) {
            if (!process.env[name]) throw new Error(`Missing stable signing credential: ${name}`);
          }
          NODE

      - name: Import stable macOS signing certificate
        if: ${{ runner.os == 'macOS' && !contains(env.RELEASE_TAG, '-') }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/enso-signing.p12"
          keychain="$RUNNER_TEMP/enso-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Sign macOS capture runtime and refresh integrity manifest
        if: ${{ runner.os == 'macOS' && !contains(env.RELEASE_TAG, '-') }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/sign-macos-resources.mjs

      - name: Import stable Windows signing certificate
        if: ${{ runner.os == 'Windows' && !contains(env.RELEASE_TAG, '-') }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'enso-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if ($certificate.Thumbprint -ine $env:WINDOWS_CERTIFICATE_THUMBPRINT) { throw 'Signing certificate identity mismatch' }
          } finally { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }

      - name: Configure release packaging
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: node scripts/release-config.mjs

      - name: Enable verbose Tauri diagnostics on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'TAURI_CLI_VERBOSITY=1' >> "$GITHUB_ENV"

      - name: Build Tauri installers
        env:
          APPLE_ID: ${{ !contains(env.RELEASE_TAG, '-') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ !contains(env.RELEASE_TAG, '-') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ !contains(env.RELEASE_TAG, '-') && secrets.APPLE_TEAM_ID || '' }}
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          tauriScript: npm run tauri
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --config src-tauri/ci-bundle.json

      - name: Smoke-test macOS bundle resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          test "$(find "$bundle_dir" -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          dmg_file="$(find "$bundle_dir" -type f -name '*.dmg' -print -quit)"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_file"
          test -n "$(find "$mount_dir" -type d -name '*.app' -print -quit)"
          app_bundle="$(find "$mount_dir" -type d -name '*.app' -print -quit)"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            xcrun stapler validate "$app_bundle"
            spctl --assess --type execute --verbose=2 "$app_bundle"
          fi
          installed="$RUNNER_TEMP/enso-installed-smoke"
          mkdir -p "$installed"
          ditto "$app_bundle" "$installed/Ensō Time.app"
          executable="$(find "$installed/Ensō Time.app/Contents/MacOS" -type f -print -quit)"
          node scripts/installer-smoke.mjs --app "$executable" --report "node_modules/.cache/enso-time-qa/installed-app.json"

          for required in POLYFORM-NONCOMMERCIAL-1.0.0.txt MPL-2.0.txt THIRD_PARTY_NOTICES.md aw-watcher-window aw-watcher-afk; do
            test -n "$(find "$mount_dir" -type f -name "$required" -print -quit)"
          done

      - name: Smoke-test Windows installer resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter *.msi)
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer before smoke testing."
          }

          function Get-MsiProperty {
            param($Database, [string]$Name)
            $view = $null
            $record = $null
            try {
              $query = "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = '$Name'"
              $view = $Database.GetType().InvokeMember(
                "OpenView", [System.Reflection.BindingFlags]::InvokeMethod,
                $null, $Database, @($query)
              )
              [void]$view.GetType().InvokeMember(
                "Execute", [System.Reflection.BindingFlags]::InvokeMethod,
                $null, $view, $null
              )
              $record = $view.GetType().InvokeMember(
                "Fetch", [System.Reflection.BindingFlags]::InvokeMethod,
                $null, $view, $null
              )
              if ($null -eq $record) {
                throw "MSI Property table does not contain $Name."
              }
              return [string](
                $record.GetType().InvokeMember(
                  "StringData", [System.Reflection.BindingFlags]::GetProperty,
                  $null, $record, @(1)
                )
              )
            } finally {
              if ($null -ne $record -and [System.Runtime.InteropServices.Marshal]::IsComObject($record)) {
                [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($record)
              }
              if ($null -ne $view -and [System.Runtime.InteropServices.Marshal]::IsComObject($view)) {
                [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($view)
              }
            }
          }

          $installer = $null
          $database = $null
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $database = $installer.GetType().InvokeMember(
              "OpenDatabase", [System.Reflection.BindingFlags]::InvokeMethod,
              $null, $installer, @($msi[0].FullName, 0)
            )
            $productName = Get-MsiProperty -Database $database -Name "ProductName"
            $upgradeCode = (Get-MsiProperty -Database $database -Name "UpgradeCode").Trim("{}").ToLowerInvariant()
            if ($productName -cne "Enso Time") {
              throw "MSI ProductName mismatch: expected Enso Time, received $productName."
            }
            if ($upgradeCode -cne "b9b13e4b-5399-58c4-b563-de7a5e0c02a9") {
              throw "MSI UpgradeCode mismatch: received $upgradeCode."
            }
          } finally {
            if ($null -ne $database -and [System.Runtime.InteropServices.Marshal]::IsComObject($database)) {
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($database)
            }
            if ($null -ne $installer -and [System.Runtime.InteropServices.Marshal]::IsComObject($installer)) {
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
            }
            [GC]::Collect()
            [GC]::WaitForPendingFinalizers()
          }

          $msiExtract = Join-Path $env:RUNNER_TEMP "enso-time-msi-smoke"
          $nsisExtract = Join-Path $env:RUNNER_TEMP "enso-time-nsis-smoke"
          New-Item -ItemType Directory -Force $msiExtract, $nsisExtract | Out-Null
          $msiArgs = @("/a", "`"$($msi[0].FullName)`"", "/qn", "TARGETDIR=`"$msiExtract`"")
          $msiProcess = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($msiProcess.ExitCode)."
          }
          & 7z x -y "-o$nsisExtract" $nsis[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS structural extraction failed with exit code $LASTEXITCODE."
          }

          foreach ($root in @($msiExtract, $nsisExtract)) {
            foreach ($required in @(
              "POLYFORM-NONCOMMERCIAL-1.0.0.txt",
              "MPL-2.0.txt",
              "THIRD_PARTY_NOTICES.md",
              "aw-watcher-window.exe",
              "aw-watcher-afk.exe"
            )) {
              if (-not (Get-ChildItem $root -Recurse -File -Filter $required -ErrorAction SilentlyContinue)) {
                throw "Missing $required in extracted installer at $root."
              }
            }
          }

      - name: Install and launch Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter *.msi)[0]
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter *.exe)[0]
          if ($env:RELEASE_TAG -notmatch '-') {
            foreach ($artifact in @($msi, $nsis)) {
              if ((Get-AuthenticodeSignature $artifact.FullName).Status -ne 'Valid') { throw 'Installer signature verification failed' }
            }
          }
          function Invoke-AppSmoke($Root, $Report) {
            $app = @(Get-ChildItem $Root -Recurse -File -Filter 'enso-time.exe')
            if ($app.Count -ne 1) { throw 'Expected one installed Enso Time executable' }
            if ($env:RELEASE_TAG -notmatch '-' -and (Get-AuthenticodeSignature $app[0].FullName).Status -ne 'Valid') { throw 'App signature verification failed' }
            node scripts/installer-smoke.mjs --app $app[0].FullName --report $Report
            if ($LASTEXITCODE -ne 0) { throw 'Installed app failed smoke validation' }
          }
          $msiRoot = Join-Path $env:RUNNER_TEMP 'enso-installed-msi'
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', "INSTALLDIR=`"$msiRoot`"") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw 'MSI installation failed' }
          try { Invoke-AppSmoke $msiRoot 'node_modules/.cache/enso-time-qa/installed-msi.json' }
          finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$($msi.FullName)`"", '/qn') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw 'MSI uninstall failed' }
          }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'enso-installed-nsis'
          $process = Start-Process $nsis.FullName -ArgumentList @('/S', "/D=$nsisRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          try { Invoke-AppSmoke $nsisRoot 'node_modules/.cache/enso-time-qa/installed-nsis.json' }
          finally {
            $uninstaller = @(Get-ChildItem $nsisRoot -File -Filter '*uninstall*.exe')
            if ($uninstaller.Count -ne 1) { throw 'Expected NSIS uninstaller' }
            $process = Start-Process $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'NSIS uninstall failed' }
          }

      - name: Upload release QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-qa-${{ matrix.aw_target }}-${{ env.SOURCE_COMMIT }}
          include-hidden-files: true
          retention-days: 30
          path: |
            node_modules/.cache/enso-time-qa/
            node_modules/.cache/enso-time-playwright/
            node_modules/.cache/enso-time-playwright-report/

      - name: Stage macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          bundle_dir="src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          test "$(find "$bundle_dir" -type f -name '*.dmg' | wc -l | tr -d ' ')" -eq 1
          dmg_file="$(find "$bundle_dir" -type f -name '*.dmg' -print -quit)"
          cp "$dmg_file" "release-assets/enso-time-${RELEASE_TAG#v}-${AW_TARGET}.dmg"

      - name: Stage Windows MSI and NSIS installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $bundle = "src-tauri/target/$env:RUST_TARGET/release/bundle"
          $msi = @(Get-ChildItem "$bundle/msi" -File -Filter *.msi)
          $nsis = @(Get-ChildItem "$bundle/nsis" -File -Filter *.exe)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer; found $($msi.Count) MSI and $($nsis.Count) NSIS."
          }
          $version = $env:RELEASE_TAG.TrimStart("v")
          Copy-Item $msi[0].FullName "release-assets/enso-time-$version-${env:AW_TARGET}.msi"
          Copy-Item $nsis[0].FullName "release-assets/enso-time-$version-${env:AW_TARGET}.exe"

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: enso-time-${{ matrix.aw_target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing files and macOS keychain
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/enso-signing.p12" "$RUNNER_TEMP/enso-signing.pfx"
          if [[ "$RUNNER_OS" == "macOS" && -f "$RUNNER_TEMP/enso-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/enso-signing.keychain-db"
          fi


  release:
    name: Publish GitHub release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
      WORKFLOW_COMMIT: ${{ needs.resolve.outputs.workflow_commit }}
      WORKFLOW_REF: ${{ needs.resolve.outputs.workflow_ref }}

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.source_commit }}
          fetch-depth: 1

      - name: Verify immutable source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Download installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: release-assets

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 | sort -z)
          test "${#files[@]}" -eq 4
          test "$(printf '%s\n' "${files[@]##*/}" | sort -u | wc -l)" -eq 4
          : > SHA256SUMS
          for file in "${files[@]}"; do
            sha256sum "$file" | sed "s#  .*#  $(basename "$file")#" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          test -s SHA256SUMS

      - name: Generate release/source binding predicate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          assets="$(jq -Rn '[
            inputs
            | capture("^(?<sha256>[0-9a-f]{64})  (?<name>.+)$")
            | {name, sha256}
          ]' < SHA256SUMS)"
          jq -n \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowCommit "$WORKFLOW_COMMIT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg eventName "$EVENT_NAME" \
            --arg repository "$REPOSITORY" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg runId "$RUN_ID" \
            --argjson assets "$assets" \
            '{
              schemaVersion: 1,
              releaseTag: $releaseTag,
              sourceCommit: $sourceCommit,
              workflow: {
                commit: $workflowCommit,
                ref: $workflowRef
              },
              invocation: {
                event: $eventName,
                repository: $repository,
                runAttempt: $runAttempt,
                runId: $runId
              },
              assets: $assets
            }' > RELEASE_PROVENANCE.json
          jq -e \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowCommit "$WORKFLOW_COMMIT" \
            --arg workflowRef "$WORKFLOW_REF" \
            '.schemaVersion == 1
             and .releaseTag == $releaseTag
             and .sourceCommit == $sourceCommit
             and .workflow.commit == $workflowCommit
             and .workflow.ref == $workflowRef
             and (.assets | length == 4)
             and all(.assets[]; (.name | test("^[A-Za-z0-9._-]+$"))
               and (.sha256 | test("^[0-9a-f]{64}$")))' \
            RELEASE_PROVENANCE.json > /dev/null

      - name: Generate GitHub build provenance
        id: build_provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: SHA256SUMS

      - name: Generate signed release/source binding
        id: release_binding
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: SHA256SUMS
          predicate-type: https://github.com/mateofh/enso-time/attestations/release/v1
          predicate-path: RELEASE_PROVENANCE.json

      - name: Stage provenance records
        shell: bash
        run: |
          test -s "${{ steps.build_provenance.outputs.bundle-path }}"
          test -s "${{ steps.release_binding.outputs.bundle-path }}"
          cp "${{ steps.build_provenance.outputs.bundle-path }}" \
            "enso-time-${RELEASE_TAG#v}-provenance.sigstore.json"
          cp "${{ steps.release_binding.outputs.bundle-path }}" \
            "enso-time-${RELEASE_TAG#v}-release-binding.sigstore.json"
          cp RELEASE_PROVENANCE.json \
            "enso-time-${RELEASE_TAG#v}-release-provenance.json"

      - name: Set up Node.js for stable release gate
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Require stable human QA evidence
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          STABLE_QA_EVIDENCE: ${{ vars.STABLE_QA_EVIDENCE }}
        run: node scripts/stable-qa.mjs

      - name: Verify tag still points to the immutable source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/enso-release/publish-tag"
          current_commit="$(git rev-parse 'refs/enso-release/publish-tag^{commit}')"
          test "$current_commit" = "$SOURCE_COMMIT"

      - name: Publish installers and checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Ensō Time ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          body: |
            Source-available release. Use is limited by PolyForm Noncommercial 1.0.0.

            ${{ contains(env.RELEASE_TAG, '-') && 'Beta installers are ad-hoc signed on macOS and unsigned on Windows.' || 'Stable installers require Developer ID signing and notarization on macOS and Authenticode signing on Windows.' }} Verify downloads against SHA256SUMS.

            GitHub SLSA provenance is available through the attestations API and the attached standard Sigstore bundle. It identifies the release workflow invocation that collected and signed the installer hashes; it does not independently identify each matrix build job. Verify an installer with `gh attestation verify INSTALLER --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/release.yml --signer-digest ${{ needs.resolve.outputs.workflow_commit }} --source-digest ${{ github.sha }}`.

            A second signed custom attestation binds each installer digest to the release tag, immutable source commit, and workflow commit/ref recorded in the attached release provenance JSON. Verify it with the same signer/source digests plus `--predicate-type https://github.com/mateofh/enso-time/attestations/release/v1 --format json`. For the manual beta.2 backfill, GitHub's OIDC source and signer digests both identify the audited workflow commit on `main`; inspect the signed custom predicate to confirm the separately checked-out `fceb6c7929e0cf469de9af482c0fb21da34062d9` source and the installer name/hash. See `docs/RELEASE_PROVENANCE.md` for the fail-closed commands.

            Attestations prove the signer workflow and artifact integrity, not that the signed predicate is independently truthful or that the software is secure. Provenance does not replace Apple Developer ID/notarization or Windows Authenticode and does not suppress Gatekeeper or SmartScreen warnings.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            SHA256SUMS
            enso-time-*-provenance.sigstore.json
            enso-time-*-release-binding.sigstore.json
            enso-time-*-release-provenance.json
